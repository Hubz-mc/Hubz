<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minhas Indicações</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;scrollbar-width:none}
*::-webkit-scrollbar{display:none}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f0f0f;color:#fff;max-width:480px;margin:0 auto;min-height:100vh}

header{padding:20px 16px 12px;background:#0f0f0f;position:sticky;top:0;z-index:10}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
header h1{font-size:22px;font-weight:800;letter-spacing:-0.5px}
header h1 span{color:#ff6b35}
.search-bar{background:#1c1c1e;border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:8px;color:#888;font-size:14px}
.search-bar input{background:none;border:none;outline:none;color:#fff;font-size:14px;flex:1}
.search-bar input::placeholder{color:#555}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 16px 40px}

.card{background:#1c1c1e;border-radius:16px;overflow:hidden;cursor:pointer;transition:transform 0.15s;position:relative}
.card:active{transform:scale(0.97)}

.card-img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#2c2c2e}

.badge{position:absolute;top:8px;left:8px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;background:rgba(255,107,53,0.9);color:#fff;border-radius:6px;padding:3px 7px;backdrop-filter:blur(4px)}

.card-body{padding:10px 10px 12px}
.card-name{font-size:13px;font-weight:700;line-height:1.3;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-price{font-size:15px;font-weight:800;color:#ff6b35;margin-bottom:8px}
.card-price small{font-size:10px;color:#888;font-weight:400;display:block;margin-top:1px}

.btn-mini{display:block;width:100%;padding:9px;background:#ff6b35;color:#fff;border:none;border-radius:10px;font-size:12px;font-weight:700;text-align:center;cursor:pointer;text-decoration:none;transition:background 0.15s}
.btn-mini:active{background:#e55a28}

/* CAROUSEL */
.promo-carousel{padding:14px 0 6px;background:#0f0f0f}
.promo-label{font-size:11px;font-weight:700;color:#666;text-transform:uppercase;letter-spacing:0.8px;padding:0 16px;margin-bottom:10px}
.carousel-track{display:flex;gap:10px;overflow-x:auto;padding:0 16px 10px 16px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;scroll-padding-left:16px}
.carousel-track::-webkit-scrollbar{display:none}
.promo-card{flex:0 0 220px;background:linear-gradient(135deg,#1c1c1e,#2c2c2e);border-radius:16px;overflow:hidden;scroll-snap-align:start;cursor:pointer;position:relative;transition:transform 0.15s}
.promo-card:active{transform:scale(0.97)}
.promo-card-img{width:100%;height:110px;object-fit:cover;display:block}
.promo-card-body{padding:10px 12px 12px}
.promo-tag{font-size:10px;font-weight:700;text-transform:uppercase;color:#ff6b35;letter-spacing:0.5px;margin-bottom:4px}
.promo-title{font-size:13px;font-weight:700;line-height:1.3;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.promo-row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.promo-price{font-size:15px;font-weight:900;color:#ff6b35}
.promo-discount{font-size:10px;font-weight:700;background:#ff6b35;color:#fff;border-radius:5px;padding:2px 6px}
.promo-dots{display:flex;justify-content:center;gap:5px;padding-bottom:4px}
.promo-dots span{width:6px;height:6px;border-radius:50%;background:#2c2c2e;transition:background 0.2s}
.promo-dots span.active{background:#ff6b35;width:16px;border-radius:3px}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:100;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.modal{background:#1c1c1e;border-radius:24px 24px 0 0;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding-bottom:32px}
.modal-img{width:100%;height:220px;object-fit:cover;border-radius:24px 24px 0 0}
.modal-body{padding:16px 18px}
.modal-badge{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;background:rgba(255,107,53,0.15);color:#ff6b35;border-radius:7px;padding:4px 9px;margin-bottom:8px}
.modal-name{font-size:20px;font-weight:800;line-height:1.3;margin-bottom:6px}
.modal-desc{font-size:14px;color:#aaa;line-height:1.6;margin-bottom:14px}
.features{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.feat{font-size:12px;background:#2c2c2e;color:#ccc;border-radius:8px;padding:5px 10px;font-weight:500}
.store-label{font-size:11px;font-weight:700;color:#666;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px}
.store-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.stab{flex:1;min-width:80px;padding:10px 8px;border-radius:12px;border:1.5px solid #2c2c2e;background:#2c2c2e;color:#aaa;font-size:12px;font-weight:600;text-align:center;cursor:pointer;transition:all 0.15s;line-height:1.3}
.stab .sname{display:block;font-size:13px;font-weight:700}
.stab .sprice{display:block;font-size:11px;color:#777;margin-top:2px}
.stab.active{border-color:#ff6b35;background:rgba(255,107,53,0.12);color:#ff6b35}
.stab.active .sprice{color:#ff6b35}
.price-big{font-size:30px;font-weight:900;color:#fff;margin-bottom:2px}
.price-inst{font-size:13px;color:#777;margin-bottom:18px}
.btn-go{display:block;width:100%;padding:17px;background:#ff6b35;color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:800;text-align:center;cursor:pointer;text-decoration:none;letter-spacing:0.2px}
.btn-go:active{background:#e55a28}
.close-btn{position:absolute;top:14px;right:14px;width:32px;height:32px;background:rgba(0,0,0,0.5);border:none;border-radius:50%;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal-wrap{position:relative}

/* ═══════════════════════════════════════
   APENAS DESKTOP — nada abaixo afeta
   o layout mobile original
═══════════════════════════════════════ */
@media(min-width:860px){
  body{max-width:none}

  header{padding:20px 40px 14px;border-bottom:1px solid #1c1c1e}
  .header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:16px}
  .header-top{margin-bottom:0;flex:none}
  .search-bar{flex:1;max-width:420px;margin-bottom:0}

  .desktop-wrap{max-width:1200px;margin:0 auto;display:flex;gap:0}

  /* Sidebar de promoções */
  .sidebar-desktop{width:230px;flex-shrink:0;padding:20px 0 40px;position:sticky;top:65px;max-height:calc(100vh - 65px);overflow-y:auto;scrollbar-width:none}
  .sidebar-desktop::-webkit-scrollbar{display:none}
  .sd-title{font-size:11px;font-weight:700;color:#444;text-transform:uppercase;letter-spacing:.8px;padding:0 20px;margin-bottom:12px}
  .sd-card{background:#1c1c1e;border-radius:14px;overflow:hidden;cursor:pointer;margin:0 20px 10px;transition:transform .15s}
  .sd-card:hover{transform:scale(1.02)}
  .sd-img{width:100%;height:80px;object-fit:cover;display:block;background:#2c2c2e}
  .sd-body{padding:8px 10px 10px}
  .sd-tag{font-size:9px;font-weight:700;text-transform:uppercase;color:#ff6b35;letter-spacing:.5px;margin-bottom:2px}
  .sd-name{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
  .sd-row{display:flex;align-items:center;justify-content:space-between}
  .sd-price{font-size:13px;font-weight:900;color:#ff6b35}
  .sd-disc{font-size:9px;font-weight:700;background:#ff6b35;color:#fff;border-radius:4px;padding:2px 5px}

  /* Área principal */
  .main-desktop{flex:1;min-width:0;padding:16px 40px 40px 24px}

  /* Carrossel vira sidebar — some */
  .promo-carousel{display:none}

  /* Grid 3 colunas */
  .grid{grid-template-columns:repeat(3,1fr);gap:14px;padding:0}

  /* Modal centralizado */
  .overlay{align-items:center}
  .modal{border-radius:20px;max-width:520px;max-height:85vh}
  .modal-img{height:260px;border-radius:20px 20px 0 0}
}

@media(min-width:1100px){
  .grid{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-top">
      <h1>Minha <span>Loja</span></h1>
    </div>
    <div class="search-bar">
      <svg width="15" height="15" fill="none" stroke="#555" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" placeholder="Buscar produto..." id="search-input">
    </div>
  </div>
</header>

<!-- Carrossel de Promoções (mobile) -->
<div class="promo-carousel">
  <div class="promo-label">🔥 Promoções em destaque</div>
  <div class="carousel-track" id="carousel-track"></div>
  <div class="promo-dots" id="promo-dots"></div>
</div>

<!-- Wrapper desktop -->
<div class="desktop-wrap">
  <aside class="sidebar-desktop" id="sidebar-desktop" style="display:none"></aside>
  <div class="main-desktop">
    <div class="grid" id="grid"></div>
  </div>
</div>

<!-- Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-wrap">
      <img class="modal-img" id="m-img" src="" alt="">
      <button class="close-btn" id="close-btn">✕</button>
    </div>
    <div class="modal-body">
      <span class="modal-badge" id="m-badge"></span>
      <div class="modal-name" id="m-name"></div>
      <div class="modal-desc" id="m-desc"></div>
      <div class="features" id="m-feats"></div>
      <div class="store-label">Escolha a loja</div>
      <div class="store-tabs" id="m-tabs"></div>
      <div class="price-big" id="m-price"></div>
      <div class="price-inst" id="m-inst"></div>
      <a class="btn-go" id="m-btn" href="#" target="_blank" rel="noopener">Ver na loja</a>
    </div>
  </div>
</div>

<script>
const produtos = [
  {
    id:1, categoria:"Roupa",
    nome:"Kit 5 Blusas Feminina",
    descricao:" Fabricada com material principal de algodão, ela foi projetada pensando no bem-estar do seu corpo.",
    imagem:"img/Kit 5 Blusas.jpg",
    features:["Algodão","Lisa","Passeio"],
    lojas:[
        {nome:"Shopee",preco:"R$ 78,66",parcelas:"12x de R$ 8,04",link:"https://s.shopee.com.br/5flSWgEUTF?share_channel_code=1"},
    ]
  },
  {
    id:2, categoria:"Roupa",
    nome:"Regata + Short",
    descricao:"Esse conjunto é a peça chave que faltava no seu guarda-roupa para você arrasar em qualquer ocasião, do almoço casual à balada inesquecível.",
    imagem:"img/Regata.jpg",
    features:["Suplex","alfaiataria"],
    lojas:[
      {nome:"Shopee",preco:"R$ 49,90",parcelas:"9x de R$ 6,31",link:"https://s.shopee.com.br/30khMfXDtB"},
    ]
  },
  {
    id:3, categoria:"Roupa",
    nome:"Vestido feminino",
    descricao:"Perfeito para qualquer ocasião. Você pode usar em festas, jantar ou chás de revelação, é só combinar com aquela sandália bafônica!",
    imagem:"img/Vestido.png",
    features:["Manga Curta","Casual","Verão e inverno"],
    lojas:[
      {nome:"Shopee",preco:"R$ 53,35",parcelas:"10x de R$ 6,12",link:"https://s.shopee.com.br/5VS2LznSMX"},
    ]
  },
  {
    id:4, categoria:"Roupa",
    nome:"Cropped Regata",
    descricao:"Garanta o look perfeito para torcer com estilo e conforto! Nosso Kit com 3 Croppeds Regata do Brasil une a tendência da moda casual com o orgulho de vestir as cores da nossa bandeira.",
    imagem:"img/Brasil.jpg",
    features:["Lisa","Verão"],
    lojas:[
      {nome:"Shopee",preco:"R$ 31,98",parcelas:"6x de R$ 5,96",link:"https://s.shopee.com.br/1VvtibJC5p"},
    ]
  },
  {
    id:5, categoria:"Roupa",
    nome:"Pijama Virginia",
    descricao:"Pijama confortável e estiloso, perfeito para noites de descanso com muito conforto e charme.",
    imagem:"img/Promo01.jpg",
    features:["Confortável","Macio","Dormir"],
    lojas:[
      {nome:"Shopee",preco:"R$ 21,67",parcelas:"",link:"https://s.shopee.com.br/4fsvUTE6gU"},
    ]
  },
  {
    id:6, categoria:"Roupa",
    nome:"Kit Short Canelado",
    descricao:"Kit de shorts canelados, combinação perfeita de estilo e conforto para o dia a dia.",
    imagem:"img/Promo02.jpg",
    features:["Canelado","Casual","Verão"],
    lojas:[
      {nome:"Shopee",preco:"R$ 23,49",parcelas:"",link:"https://s.shopee.com.br/30khVbc9YK"},
    ]
  },
  {
    id:7, categoria:"Roupa",
    nome:"Kit 10 Blusa Feminina",
    descricao:"Kit com 10 blusas femininas variadas, ideal para renovar o guarda-roupa com praticidade e economia.",
    imagem:"img/Promo03.jpg",
    features:["Algodão","Lisa","Passeio"],
    lojas:[
      {nome:"Shopee",preco:"R$ 59,98",parcelas:"",link:"https://s.shopee.com.br/175w8Cc7Y"},
    ]
  }
];

let lojaAtiva = {};

function abrirModal(p) {
  lojaAtiva[p.id] = lojaAtiva[p.id] || 0;
  document.getElementById('m-img').src = p.imagem;
  document.getElementById('m-badge').textContent = p.categoria;
  document.getElementById('m-name').textContent = p.nome;
  document.getElementById('m-desc').textContent = p.descricao;
  const feats = document.getElementById('m-feats');
  feats.innerHTML = p.features.map(f=>`<span class="feat">✓ ${f}</span>`).join('');
  const tabs = document.getElementById('m-tabs');
  tabs.innerHTML = '';
  p.lojas.forEach((l,i)=>{
    const t = document.createElement('button');
    t.className = 'stab' + (i===lojaAtiva[p.id]?' active':'');
    t.innerHTML = `<span class="sname">${l.nome}</span><span class="sprice">${l.preco}</span>`;
    t.onclick = ()=>{
      lojaAtiva[p.id]=i;
      tabs.querySelectorAll('.stab').forEach((s,j)=>s.classList.toggle('active',j===i));
      atualizarPreco(p,i);
    };
    tabs.appendChild(t);
  });
  atualizarPreco(p, lojaAtiva[p.id]);
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow='hidden';
}

function atualizarPreco(p,i){
  const l=p.lojas[i];
  document.getElementById('m-price').textContent=l.preco;
  document.getElementById('m-inst').textContent=l.parcelas;
  const btn=document.getElementById('m-btn');
  btn.href=l.link;
  btn.textContent=`Comprar na ${l.nome}`;
}

document.getElementById('close-btn').onclick=fecharModal;
document.getElementById('overlay').onclick=e=>{if(e.target===document.getElementById('overlay'))fecharModal()};
function fecharModal(){document.getElementById('overlay').classList.remove('open');document.body.style.overflow='';}

function renderGrid(lista){
  const g=document.getElementById('grid');
  g.innerHTML='';
  lista.forEach(p=>{
    const c=document.createElement('div');
    c.className='card';
    c.innerHTML=`
      <img class="card-img" src="${p.imagem}" alt="${p.nome}" loading="lazy">
      <span class="badge">${p.categoria}</span>
      <div class="card-body">
        <div class="card-name">${p.nome}</div>
        <div class="card-price">${p.lojas[0].preco}<small>${p.lojas[0].parcelas}</small></div>
        <a class="btn-mini" href="#">Ver oferta</a>
      </div>`;
    c.querySelector('.btn-mini').onclick=e=>{e.preventDefault();abrirModal(p);};
    c.querySelector('.card-img').onclick=()=>abrirModal(p);
    c.querySelector('.card-name').onclick=()=>abrirModal(p);
    g.appendChild(c);
  });
}

document.getElementById('search-input').oninput=function(){
  const q=this.value.toLowerCase();
  const base=produtos.filter(p=>!promocoes.some(pr=>pr.produtoId===p.id));
  renderGrid(q?base.filter(p=>p.nome.toLowerCase().includes(q)||p.categoria.toLowerCase().includes(q)):base);
};

// CARROSSEL
const promocoes = [
  {titulo:" PIJAMA VIRGINIA",tag:"Roupa",preco:"R$ 21,67",desconto:"-46%",imagem:"img/Promo01.jpg",produtoId:5},
  {titulo:"kit short canelado",tag:"Roupa",preco:"R$ 23,49",desconto:"-71%",imagem:"img/Promo02.jpg",produtoId:6},
  {titulo:"Kit 10 Blusa Feminina",tag:"Roupa",preco:"R$ 59,98",desconto:"-40%",imagem:"img/Promo03.jpg",produtoId:7},
];

function renderCarousel(){
  const track = document.getElementById('carousel-track');
  const dots  = document.getElementById('promo-dots');
  track.innerHTML='';
  dots.innerHTML='';

  promocoes.forEach((promo, i) => {
    const card = document.createElement('div');
    card.className = 'promo-card';
    card.innerHTML = `
      <img class="promo-card-img" src="${promo.imagem}" alt="${promo.titulo}" loading="lazy">
      <div class="promo-card-body">
        <div class="promo-tag">${promo.tag}</div>
        <div class="promo-title">${promo.titulo}</div>
        <div class="promo-row">
          <span class="promo-price">${promo.preco}</span>
          <span class="promo-discount">${promo.desconto}</span>
        </div>
      </div>`;
    card.onclick = () => {
      const p = produtos.find(x => x.id === promo.produtoId);
      if(p) abrirModal(p);
    };
    track.appendChild(card);

    const dot = document.createElement('span');
    if(i===0) dot.classList.add('active');
    dots.appendChild(dot);
  });

  const allCards = track.querySelectorAll('.promo-card');
  const allDots  = dots.querySelectorAll('span');
  let userScrolled = false;
  track.addEventListener('scroll', () => { userScrolled = true; }, { once: true });
  const visibilityMap = new Map();
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => { visibilityMap.set(entry.target, entry.intersectionRatio); });
    if(!userScrolled) return;
    let bestIdx = 0, bestRatio = -1;
    allCards.forEach((card, i) => {
      const ratio = visibilityMap.get(card) || 0;
      if(ratio > bestRatio){ bestRatio = ratio; bestIdx = i; }
    });
    allDots.forEach((d,j) => d.classList.toggle('active', j===bestIdx));
  }, { root: track, threshold: [0, 0.25, 0.5, 0.75, 1] });
  allCards.forEach(c => observer.observe(c));
}

// SIDEBAR DESKTOP
function renderSidebarDesktop(){
  const sidebar = document.getElementById('sidebar-desktop');
  sidebar.innerHTML = `<div class="sd-title">🔥 Promoções em destaque</div>`;
  promocoes.forEach(promo => {
    const card = document.createElement('div');
    card.className = 'sd-card';
    card.innerHTML = `
      <img class="sd-img" src="${promo.imagem}" alt="${promo.titulo}" loading="lazy">
      <div class="sd-body">
        <div class="sd-tag">${promo.tag}</div>
        <div class="sd-name">${promo.titulo}</div>
        <div class="sd-row">
          <span class="sd-price">${promo.preco}</span>
          <span class="sd-disc">${promo.desconto}</span>
        </div>
      </div>`;
    card.onclick = () => {
      const p = produtos.find(x => x.id === promo.produtoId);
      if(p) abrirModal(p);
    };
    sidebar.appendChild(card);
  });
}

function checkDesktop(){
  const isDesktop = window.matchMedia('(min-width:860px)').matches;
  document.getElementById('sidebar-desktop').style.display = isDesktop ? 'block' : 'none';
}
window.matchMedia('(min-width:860px)').addEventListener('change', checkDesktop);
checkDesktop();

renderCarousel();
renderSidebarDesktop();
renderGrid(produtos.filter(p=>!promocoes.some(pr=>pr.produtoId===p.id)));
window.scrollTo(0, 0);
</script>
</body>
</html>
