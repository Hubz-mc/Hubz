<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Timers</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f0f0f;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#login-screen{width:100%;max-width:360px}
#login-screen h1{font-size:20px;font-weight:800;margin-bottom:6px}
#login-screen p{font-size:13px;color:#666;margin-bottom:28px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;color:#888;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px}
.field input{width:100%;background:#1c1c1e;border:1.5px solid #2c2c2e;border-radius:12px;padding:12px 14px;color:#fff;font-size:14px;outline:none;transition:border-color 0.2s}
.field input:focus{border-color:#ff6b35}
.btn-login{width:100%;padding:13px;background:#ff6b35;color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:800;cursor:pointer;margin-top:6px;transition:opacity 0.2s}
.btn-login:active{opacity:0.85}
.error-msg{font-size:12px;color:#ff4444;margin-top:10px;text-align:center;min-height:18px}
#admin-screen{display:none;width:100%;max-width:400px}
.admin-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.admin-header h1{font-size:18px;font-weight:800}
.admin-header span{font-size:11px;color:#555}
.btn-logout{background:none;border:1.5px solid #2c2c2e;border-radius:8px;color:#888;font-size:12px;font-weight:700;padding:6px 12px;cursor:pointer;transition:all 0.15s}
.btn-logout:hover{border-color:#ff4444;color:#ff4444}
.panel{background:#1c1c1e;border-radius:16px;padding:20px}
.sel-label{font-size:11px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px}
.selector{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.sel-btn{background:#0f0f0f;border:1.5px solid #2c2c2e;border-radius:12px;padding:12px 14px;color:#aaa;font-size:13px;font-weight:700;cursor:pointer;text-align:left;transition:all 0.15s;display:flex;align-items:center;justify-content:space-between;width:100%}
.sel-btn .restante{font-size:11px;color:#555;font-weight:600}
.sel-btn.active{border-color:#ff6b35;color:#fff;background:#1a1a1a}
.sel-btn.active .restante{color:#ff6b35}
.tempo-label{font-size:11px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px}
.inputs-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.inp-group{display:flex;flex-direction:column;gap:5px}
.inp-group input{background:#0f0f0f;border:1.5px solid #2c2c2e;border-radius:10px;padding:10px 6px;color:#fff;font-size:16px;font-weight:800;text-align:center;outline:none;transition:border-color 0.2s;width:100%}
.inp-group input:focus{border-color:#ff6b35}
.inp-group label{font-size:10px;color:#555;text-align:center;font-weight:600;text-transform:uppercase;letter-spacing:0.5px}
.btn-save{width:100%;padding:12px;background:#ff6b35;color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:800;cursor:pointer;transition:opacity 0.15s}
.btn-save:active{opacity:0.8}
.btn-save:disabled{background:#2c2c2e;color:#555;cursor:not-allowed}
.save-status{font-size:12px;text-align:center;margin-top:10px;min-height:18px;font-weight:700}
</style>
</head>
<body>

<div id="login-screen">
  <h1>🔐 Admin</h1>
  <p>Acesso restrito — faça login para continuar</p>
  <div class="field">
    <label>Email</label>
    <input type="email" id="email" placeholder="pequenosteve25@gmail.com">
  </div>
  <div class="field">
    <label>Senha</label>
    <input type="password" id="senha" placeholder="••••••••" onkeydown="if(event.key==='Enter')fazerLogin()">
  </div>
  <button class="btn-login" onclick="fazerLogin()">Entrar</button>
  <div class="error-msg" id="error-msg"></div>
</div>

<div id="admin-screen">
  <div class="admin-header">
    <div>
      <h1>⏱ Timers</h1>
      <span id="user-email"></span>
    </div>
    <button class="btn-logout" onclick="fazerLogout()">Sair</button>
  </div>
  <div class="panel">
    <div class="sel-label">Selecione o produto</div>
    <div class="selector" id="selector"></div>
    <div class="tempo-label">Novo tempo</div>
    <div class="inputs-row">
      <div class="inp-group">
        <input type="number" id="inp-h" min="0" max="999" placeholder="0">
        <label>Horas</label>
      </div>
      <div class="inp-group">
        <input type="number" id="inp-m" min="0" max="59" placeholder="0">
        <label>Minutos</label>
      </div>
      <div class="inp-group">
        <input type="number" id="inp-s" min="0" max="59" placeholder="0">
        <label>Segundos</label>
      </div>
    </div>
    <button class="btn-save" id="btn-save" onclick="salvarTimer()">Salvar</button>
    <div class="save-status" id="save-status"></div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyChe4rWJphoPw4VQ1YM3OX72UmTvRKI2FE",
  authDomain: "tela-login-5062e.firebaseapp.com",
  databaseURL: "https://tela-login-5062e-default-rtdb.firebaseio.com",
  projectId: "tela-login-5062e",
  storageBucket: "tela-login-5062e.firebasestorage.app",
  messagingSenderId: "685048984991",
  appId: "1:685048984991:web:dd6fcf2ecc92af1bbef9aa"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const promocoes = [
  { id: 0, titulo: "PIJAMA VIRGINIA" },
  { id: 1, titulo: "Kit Short Canelado" },
  { id: 2, titulo: "Kit 10 Blusa Feminina" },
];

let selectedIndex = 0;
let endTimes = {};

function formatarRestante(ms) {
  const total = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

auth.onAuthStateChanged(user => {
  if (user) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-screen').style.display = 'block';
    document.getElementById('user-email').textContent = user.email;
    carregarTimers();
  } else {
    document.getElementById('login-screen').style.display = 'block';
    document.getElementById('admin-screen').style.display = 'none';
  }
});

async function fazerLogin() {
  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value;
  const err = document.getElementById('error-msg');
  err.textContent = '';
  try {
    await auth.signInWithEmailAndPassword(email, senha);
  } catch(e) {
    err.textContent = 'Email ou senha incorretos.';
  }
}

function fazerLogout() { auth.signOut(); }

async function carregarTimers() {
  for (const p of promocoes) {
    const snap = await db.ref('timers/promo_' + p.id).get();
    endTimes[p.id] = snap.exists() ? snap.val() : null;
  }
  renderSelector();
  setInterval(renderSelector, 1000);
}

function renderSelector() {
  const sel = document.getElementById('selector');
  sel.innerHTML = '';
  promocoes.forEach(p => {
    const restante = endTimes[p.id] ? endTimes[p.id] - Date.now() : null;
    const btn = document.createElement('button');
    btn.className = 'sel-btn' + (p.id === selectedIndex ? ' active' : '');
    btn.innerHTML = p.titulo + ' <span class="restante">' + (restante !== null ? formatarRestante(restante) : '—') + '</span>';
    btn.onclick = () => { selectedIndex = p.id; renderSelector(); };
    sel.appendChild(btn);
  });
}

async function salvarTimer() {
  const h = parseInt(document.getElementById('inp-h').value) || 0;
  const m = parseInt(document.getElementById('inp-m').value) || 0;
  const s = parseInt(document.getElementById('inp-s').value) || 0;
  const total = (h * 3600 + m * 60 + s) * 1000;
  const status = document.getElementById('save-status');
  const btn = document.getElementById('btn-save');
  if (total <= 0) {
    status.style.color = '#ff4444';
    status.textContent = 'Digite um tempo válido.';
    return;
  }
  btn.disabled = true;
  btn.textContent = 'Salvando...';
  status.textContent = '';
  const endTime = Date.now() + total;
  await db.ref('timers/promo_' + selectedIndex).set(endTime);
  endTimes[selectedIndex] = endTime;
  btn.disabled = false;
  btn.textContent = 'Salvar';
  status.style.color = '#4caf50';
  status.textContent = 'Salvo! Timer atualizado para todos.';
  document.getElementById('inp-h').value = '';
  document.getElementById('inp-m').value = '';
  document.getElementById('inp-s').value = '';
  setTimeout(() => { status.textContent = ''; }, 3000);
  renderSelector();
}
</script>
</body>
</html>
